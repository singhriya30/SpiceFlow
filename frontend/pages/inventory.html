<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiceFlow — Inventory</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-container"></div>

        <div class="main-content">
            <div class="page-header">
                <h1>Inventory</h1>
            </div>

            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th class="num">Stock</th>
                            <th class="num">Minimum</th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="inventory-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="adjust-modal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h2>Adjust Stock</h2>
            <p class="text-muted" id="adjust-product-name"></p>
            <p class="text-muted mb-1">Current stock: <strong id="adjust-current-qty"></strong></p>

            <form id="adjust-form">
                <label for="quantity_change">Quantity change</label>
                <input type="number" id="quantity_change" required placeholder="e.g. 50 or -5">
                <p class="text-muted" style="margin-top: -0.7rem; font-size: 0.8rem;">Use a positive number to add stock, negative to remove.</p>

                <label for="reason">Reason</label>
                <input type="text" id="reason" required placeholder="e.g. Stock received, Order correction">

                <p id="adjust-error" class="error-text" style="display: none;"></p>

                <div style="display: flex; gap: 0.5rem; margin-top: 1rem;">
                    <button type="submit" class="btn-primary">Save</button>
                    <button type="button" class="btn" id="adjust-cancel-btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script>
        async function loadInventory() {
            const products = await apiRequest("/products/");
            const tbody = document.getElementById("inventory-table-body");

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="empty-state">No products found.</td></tr>`;
                return;
            }

            const rows = await Promise.all(products.map(async (p) => {
                let inv;
                try {
                    inv = await apiRequest(`/inventory/${p.id}`);
                } catch (err) {
                    return "";
                }

                const isLow = inv.quantity <= inv.minimum_stock;

                return `
                    <tr>
                        <td>${p.name}</td>
                        <td class="num">${inv.quantity}</td>
                        <td class="num">${inv.minimum_stock}</td>
                        <td>${isLow ? '<span class="badge badge-cancelled">Low Stock</span>' : ''}</td>
                        <td><button class="btn-sm" onclick="openAdjustForm('${p.id}', '${p.name.replace(/'/g, "\\'")}', ${inv.quantity}, ${inv.minimum_stock})">Adjust</button></td>
                    </tr>
                `;
            }));

            tbody.innerHTML = rows.join("");
        }

        let currentAdjustProductId = null;

        function openAdjustForm(productId, productName, currentQty, minStock) {
            currentAdjustProductId = productId;
            document.getElementById("adjust-product-name").textContent = productName;
            document.getElementById("adjust-current-qty").textContent = currentQty;
            document.getElementById("adjust-error").style.display = "none";
            document.getElementById("adjust-form").reset();
            document.getElementById("adjust-modal").style.display = "flex";
        }

        function closeAdjustModal() {
            document.getElementById("adjust-modal").style.display = "none";
            currentAdjustProductId = null;
        }

        document.getElementById("adjust-cancel-btn").addEventListener("click", closeAdjustModal);

        document.getElementById("adjust-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const errorEl = document.getElementById("adjust-error");
            errorEl.style.display = "none";

            const payload = {
                quantity_change: parseInt(document.getElementById("quantity_change").value, 10),
                reason: document.getElementById("reason").value
            };

            try {
                await apiRequest(`/inventory/${currentAdjustProductId}/adjust`, "POST", payload);
                closeAdjustModal();
                await loadInventory();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = "block";
            }
        });

        (async function init() {
            const user = await initLayout("inventory.html");
            if (!user) return;

            try {
                await loadInventory();
            } catch (err) {
                alert("Failed to load inventory: " + err.message);
            }
        })();
    </script>
</body>
</html>
